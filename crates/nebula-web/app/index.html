    <link rel="manifest" href="/manifest.webmanifest" />
    <script>
      // Added to the Home Screen from /deck, the app opens on the Deck: iOS
      // starts it at the manifest's start_url, not the page it was added from.
      if (/^\/deck\/?$/.test(location.pathname)) document.querySelector('link[rel="manifest"]').href = "/deck.webmanifest";
    </script>
