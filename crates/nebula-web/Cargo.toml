[package]
name = "nebula-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nebula-core = { workspace = true }
nebula-client = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
futures-util = "0.3"
memchr = "2"
serde = { workspace = true }
serde_json = { workspace = true }
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
tokio = { workspace = true }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

[dev-dependencies]
tempfile = { workspace = true }
