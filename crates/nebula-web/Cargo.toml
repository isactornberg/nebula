[package]
name = "nebula-web"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
nebula-core = { workspace = true }
nebula-client = { workspace = true }
nebula-forge = { workspace = true }
anyhow = { workspace = true }
axum = "0.8"
futures-util = "0.3"
libc = "0.2"
memchr = "2"
# The QR code of a pairing's link: Project Nayuki's encoder, one file with no dependencies.
qrcodegen = "1.8"
rand = "0.10"
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = "0.11"
serde-saphyr = { version = "2.1", default-features = false, features = ["deserialize"] }
tokio = { workspace = true }
toml = { version = "1.2", default-features = false, features = ["std", "parse", "serde"] }
toml_edit = { version = "0.25.19", default-features = false, features = ["parse", "display"] }

# The Trash Finder shows, through NSFileManager, which says where it put each thing.
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSError", "NSFileManager", "NSString", "NSURL"] }

[dev-dependencies]
tempfile = { workspace = true }
